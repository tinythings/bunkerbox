name: rust

bin:
  cargo: /usr/bin/cargo
  rustc: /usr/bin/rustc
  rustfmt: /usr/bin/rustfmt
  rustup: /usr/bin/rustup
  cc: /usr/bin/cc

paths:
  - src: /lib
  - src: /lib64
  - src: /usr/lib
  - src: /usr/lib64
  - src: /etc/ssl
  - src: /etc/localtime
  - src: /usr/share/zoneinfo
  - src: /usr/lib/locale
  - src: .cargo
  - src: .rustup

env:
  CARGO_HOME: /home/.cargo
  RUSTUP_HOME: /home/.rustup
  TERM: "${TERM}"

network: none
shell: /bin/sh
