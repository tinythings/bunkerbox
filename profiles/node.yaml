name: node

bin:
  node: /usr/bin/node
  npm: /usr/bin/npm
  npx: /usr/bin/npx

paths:
  - src: /lib
  - src: /lib64
  - src: /usr/lib
  - src: /usr/lib64
  - src: /etc/ssl
  - src: /etc/localtime
  - src: /usr/share/zoneinfo
  - src: /usr/lib/locale
  - src: .npm
  - src: .node-gyp

env:
  npm_config_cache: /home/.npm
  TERM: "${TERM}"

network: none
shell: /bin/sh
