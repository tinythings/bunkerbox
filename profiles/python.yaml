name: python

bin:
  python3: /usr/bin/python3
  python: /usr/bin/python3
  pip3: /usr/bin/pip3
  pip: /usr/bin/pip3

paths:
  - src: /lib
  - src: /lib64
  - src: /usr/lib
  - src: /usr/lib64
  - src: /etc/ssl
  - src: /etc/localtime
  - src: /usr/share/zoneinfo
  - src: /usr/lib/locale
  - src: /usr/share/python3
  - src: .cache/pip

env:
  PIP_CACHE_DIR: /home/.cache/pip
  TERM: "${TERM}"

network: none
shell: /bin/sh
