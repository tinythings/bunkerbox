name: go

bin:
  go: /usr/local/go/bin/go
  gofmt: /usr/local/go/bin/gofmt

paths:
  - src: /lib
  - src: /lib64
  - src: /usr/lib
  - src: /usr/lib64
  - src: /etc/ssl
  - src: /etc/localtime
  - src: /usr/share/zoneinfo
  - src: /usr/lib/locale
  - src: /usr/local/go
  - src: go
  - src: .cache/go-build

env:
  GOROOT: /usr/local/go
  GOPATH: /home/go
  GOCACHE: /home/.cache/go-build
  TERM: "${TERM}"

network: none
shell: /bin/sh
