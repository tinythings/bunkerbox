name: make

bin:
  make: /usr/bin/make
  cc: /usr/bin/cc
  gcc: /usr/bin/gcc
  g++: /usr/bin/g++
  c++: /usr/bin/c++
  ar: /usr/bin/ar
  ld: /usr/bin/ld
  as: /usr/bin/as
  strip: /usr/bin/strip

paths:
  - src: /lib
  - src: /lib64
  - src: /usr/lib
  - src: /usr/lib64
  - src: /etc/ssl
  - src: /etc/localtime
  - src: /usr/share/zoneinfo
  - src: /usr/lib/locale

env:
  TERM: "${TERM}"

network: none
shell: /bin/sh
