[package]
name = "bunkerbox"
version = "0.4.1"
edition = "2021"

[dependencies]
actix-rt = { version = "2", optional = true }
actix-web = { version = "4", optional = true }
aes-gcm = "0.10"
awc = { version = "3", features = ["openssl"], optional = true }
base64 = "0.22"
clap = "4"
colored = "3"
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
pbkdf2 = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "io-util", "process"] }
tokio-vsock = "0.7"
ratatui = "0.30"
crossterm = "0.28"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"
ratatui-glamour = "0.3"
webbrowser = { version = "1", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"], optional = true }

[features]
auth-backend = ["actix-rt", "actix-web", "awc", "ureq", "webbrowser"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lib]
name = "bunkerbox"
path = "src/lib.rs"

[[bin]]
name = "bunkerbox"
path = "src/main.rs"

[[bin]]
name = "bunkerbox-vscomm"
path = "src/bin/bunkerbox-vscomm.rs"

[[bin]]
name = "bunkerbox-status"
path = "src/bin/bunkerbox-status.rs"

[[bin]]
name = "bunkerbox-netrelay"
path = "src/bin/bunkerbox-netrelay.rs"

[[bin]]
name = "bunkerbox-auth-backend"
path = "src/bin/bunkerbox-auth-backend.rs"
required-features = ["auth-backend"]
